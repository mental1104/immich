[project]
name = "immich-fork-scene-stacks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0", "pydantic==2.11.7"]

[project.optional-dependencies]
source = ["psycopg[binary]==3.2.9"]
test = ["pytest==8.4.2", "ruff==0.14.6", "mypy==1.18.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
scene_stacks = ["prompt.txt", "composition-prompt.txt"]
