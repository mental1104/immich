name: Fork compatibility

on:
  pull_request:
  push:
    branches: [main, nas-dev-x5-jpg, 'upgrade/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'mental1104/immich'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check migration files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF=$(git rev-parse HEAD^1)
          fi
          node docker/verify-fork-migrations.mjs "$BASE_REF"
      - name: Install and build shared SDKs
        run: |
          pnpm --filter immich --filter immich-web --filter @immich/sdk --filter @immich/plugin-sdk install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk build
      - name: Check Server and Web types
        run: |
          pnpm --dir server check
          pnpm --dir web check:svelte
          pnpm --dir web check:typescript
      - name: Server unit tests
        run: pnpm --dir server test --run --maxWorkers=2
      - name: Database upgrade and feature regressions
        run: >-
          pnpm --dir server test:medium --run --maxWorkers=2
          test/medium/specs/utils/fork-migrations.spec.ts
          test/medium/specs/utils/raw-pair.spec.ts
          test/medium/specs/utils/panorama.spec.ts
          test/medium/specs/utils/media-category.spec.ts
          test/medium/specs/repositories/person.repository.spec.ts
          test/medium/specs/services/person.service.spec.ts
          test/medium/specs/sync/sync-asset-face.spec.ts
      - name: Web unit tests
        run: pnpm --dir web test --run --maxWorkers=2
